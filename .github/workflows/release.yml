name: Release

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm to support trusted publishing
        run: npm install -g npm@latest

      - name: Extract version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      # Publishing is idempotent by design: a push to `main` that does not move
      # the version is a no-op, not a failure. That is what lets docs and CI
      # commits reach `main` without a version bump.
      - name: Check if version is already published
        id: check_published
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if npm view "@pipelex/mthds-form@$VERSION" version 2>/dev/null; then
            echo "Version $VERSION is already published to npm"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is not yet published"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      # The same gate `changelog-check.yml` runs on the release PR, repeated at
      # the last moment before the irreversible step. That gate only sees PRs
      # from a `release/v*` branch, so a version bump reaching `main` any other
      # way would otherwise publish with no entry - and npm never gives a
      # version number back. Gated on already_published so that a push which
      # does not move the version stays the deliberate no-op described above.
      - name: Assert the changelog has an entry for this version
        if: steps.check_published.outputs.already_published == 'false'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! grep -qE "^## \[v${VERSION//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [v$VERSION]' heading - refusing to publish $VERSION. Rename '## [Unreleased]' and push again."
            exit 1
          fi
          echo "Changelog entry found for v$VERSION."

      - name: Install dependencies
        if: steps.check_published.outputs.already_published == 'false'
        # --ignore-scripts skips the `prepare` hook (= npm run build), so we
        # build exactly once in the explicit Build step below. Without this,
        # the build runs three times per release: here via prepare, in the
        # Build step, and again in `npm publish`'s prepare hook.
        run: npm ci --ignore-scripts

      - name: Run quality checks (lint + format + typecheck)
        if: steps.check_published.outputs.already_published == 'false'
        run: make check

      # The story suite runs in a real browser, so `make test` needs one. The
      # install is explicit here for the same reason it is in quality-checks.yml,
      # and it is REQUIRED here rather than merely tidy: the install step above
      # runs `npm ci --ignore-scripts`, so Playwright's postinstall — the thing
      # that would otherwise fetch the browser — never runs. Without this the
      # publish job fails with "Executable doesn't exist", which reads like a
      # broken runner image rather than like a skipped lifecycle script.
      #
      # Only chromium, and only its own dependencies: this installs ~150 MB, and
      # `--with-deps` is required on the runner because headless chromium links
      # against system libraries the base image does not carry.
      - name: Install Playwright chromium
        if: steps.check_published.outputs.already_published == 'false'
        run: npx playwright install --with-deps chromium

      - name: Run tests
        if: steps.check_published.outputs.already_published == 'false'
        run: make test

      - name: Build both entry points
        if: steps.check_published.outputs.already_published == 'false'
        run: make build

      # The same bundle invariants the PR gate runs, repeated here because the
      # artifact this job publishes is built by THIS job - a green PR proves
      # nothing about the tarball that actually reaches npm.
      - name: Assert the bundle invariants
        if: steps.check_published.outputs.already_published == 'false'
        run: make assert-bundle

      - name: Publish to npm
        if: steps.check_published.outputs.already_published == 'false'
        # --ignore-scripts skips publish-time lifecycle hooks (notably
        # `prepare`, which would rebuild and clobber the artifacts the
        # assertions above just validated). Provenance/signing is handled
        # inside npm itself, not in user lifecycle scripts, so it's unaffected.
        run: npm publish --ignore-scripts --access public --provenance

      # Not gated on already_published: if a previous run published to npm but
      # failed before tagging, the rerun must still be able to backfill the
      # tag. The existence check is what keeps no-bump pushes a no-op.
      - name: Create git tag if missing
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALREADY_PUBLISHED: ${{ steps.check_published.outputs.already_published }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 0
          fi

          # Tag the commit npm ACTUALLY published, which is not always the one
          # running this step. Backfill is reachable from any push to `main`
          # carrying an already-published version, so when a release fails
          # after `npm publish` and is recovered by pushing a follow-up commit,
          # tagging this run's SHA would put the tag on the follow-up while the
          # artifact came from the merge - and since the tag then exists, every
          # later run takes the branch above and the wrong association is
          # permanent.
          #
          # npm records the publishing commit as `gitHead`, and on the normal
          # path it equals this run's SHA. When it cannot be read, what that
          # means depends on who published. If this run did, the registry has
          # not propagated the publish yet, and this run's SHA is exactly right
          # because this IS the publishing run. If an earlier run did, the
          # registry has already answered this run once, so an empty answer is
          # an error, and no commit here can be vouched for. The step fails
          # rather than skipping, because a missing tag is not left missing:
          # `gh release create` would make one on whatever `main` points at.
          PUBLISHED_SHA="$(npm view "@pipelex/mthds-form@$VERSION" gitHead 2>/dev/null || true)"
          if [ -z "$PUBLISHED_SHA" ]; then
            if [ "$ALREADY_PUBLISHED" != "false" ]; then
              echo "::error::npm did not say which commit published $VERSION, and this run did not publish it, so there is no commit to tag. Re-run this job, or push the tag v$VERSION by hand on the commit that published it; the next run then finds the tag and goes on to the release."
              exit 1
            fi
            PUBLISHED_SHA="$GITHUB_SHA"
          fi
          if [ "$PUBLISHED_SHA" != "$GITHUB_SHA" ]; then
            echo "::warning::npm published $VERSION from $PUBLISHED_SHA, not $GITHUB_SHA. Tagging the published commit."
            # A version published by hand from a commit that never reached
            # GitHub has no commit to tag, so this stays a failure; tagging
            # anything else is the wrong association this step exists to
            # prevent.
            if ! git fetch --depth=1 origin "$PUBLISHED_SHA"; then
              echo "::error::npm published $VERSION from $PUBLISHED_SHA, which origin does not have. Push that commit, or push the tag v$VERSION by hand on the commit that should carry it; the next run then finds the tag and goes on to the release."
              exit 1
            fi
          fi
          git tag "v$VERSION" "$PUBLISHED_SHA"
          git push origin "v$VERSION"

  # Not gated on already_published either, for the same recovery reason: the
  # release must be creatable on a rerun even when npm already has the version.
  github-release:
    name: Create GitHub Release
    needs:
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if release already exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog notes for current version
        if: steps.check_release.outputs.exists == 'false'
        run: |
          VERSION="${{ needs.publish.outputs.version }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Extracting changelog for version v$VERSION"

          # Anchored, dateless and with the dots escaped: the shape
          # `changelog-check.yml` gates the release PR on, so a heading that
          # passes that gate is always the one found here.
          START_LINE=$(grep -n "^## \[v${VERSION//./\\.}\]" CHANGELOG.md | head -1 | cut -d: -f1)

          # Deliberately a warning here, where the publish job hard-fails: this
          # job also runs on the recovery path, backfilling a release for a
          # version npm already has. Failing it would leave that version
          # permanently without a GitHub release, which is the opposite of what
          # the gate is for. The heading is enforced before publishing instead.
          if [ -z "$START_LINE" ]; then
            echo "Warning: No changelog entry found for version v$VERSION"
            echo "CHANGELOG_NOTES=" >> "$GITHUB_ENV"
            exit 0
          fi

          NEXT_VERSION_LINE=$(tail -n +$((START_LINE + 1)) CHANGELOG.md | grep -n "^## \[v" | head -1 | cut -d: -f1)

          if [ -z "$NEXT_VERSION_LINE" ]; then
            CHANGELOG_CONTENT=$(tail -n "+$START_LINE" CHANGELOG.md)
          else
            END_LINE=$((START_LINE + NEXT_VERSION_LINE - 1))
            CHANGELOG_CONTENT=$(sed -n "$START_LINE,${END_LINE}p" CHANGELOG.md)
          fi

          # The entry reaches the release page exactly as it was written. This
          # step used to drop every blank line and strip every line's leading
          # whitespace, which is fatal to Markdown: blank lines are what
          # separate paragraphs and close lists, and indentation is what keeps a
          # continuation paragraph inside its list item, so a structured entry
          # rendered as one run-on block. Command substitution has already
          # dropped the trailing blank lines before the next heading.
          #
          # Random delimiter, per GitHub's own guidance: the entry reaches this
          # heredoc verbatim, so a fixed marker is one line of CHANGELOG.md away
          # from closing the block early and having the remainder parsed as
          # further environment assignments.
          DELIM="CHANGELOG_EOF_$(openssl rand -hex 16)"
          {
            echo "CHANGELOG_NOTES<<$DELIM"
            echo "$CHANGELOG_CONTENT"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$CHANGELOG_NOTES" ]; then
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "$CHANGELOG_NOTES"
          else
            gh release create "v$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "v$VERSION" \
              --notes "Release v$VERSION"
          fi
