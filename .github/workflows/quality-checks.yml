name: Quality Checks

on:
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run quality checks (lint + format + typecheck)
        run: make check

      # The story suite runs in a real browser, so `make test` needs one. Only
      # chromium, and only its own dependencies: this installs ~150 MB, and
      # `--with-deps` is required on the runner because headless chromium links
      # against system libraries the base image does not carry.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: make test

      # A story that renders in dev but breaks the static build is a real
      # regression for anyone deploying the Storybook, and nothing else here
      # would catch it - `make test` renders stories through vitest, not through
      # a production build.
      - name: Build Storybook
        run: make build-storybook

      - name: Build both entry points
        run: make build

      # What a consumer's bundler will actually pull from each entry. Lint sees
      # source imports; these walk the built chunk graph, which is where a
      # banned dependency arrives - React into the headless `.` entry, or ajv
      # into `./react`. Also re-checks the 'use client' prologue esbuild drops
      # and `tsup.config.ts` puts back.
      - name: Assert the bundle invariants
        run: make assert-bundle
