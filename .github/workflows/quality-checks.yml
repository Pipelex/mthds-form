name: Quality Checks

on:
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run quality checks (lint + format + typecheck)
        run: make check

      - name: Run tests
        run: make test

      - name: Build both entry points
        run: make build

      # The `.` entry must stay headless: a React import reaching it is a
      # dependency-budget breach that lint alone cannot see, because it would
      # arrive through a shared chunk rather than through a source import.
      - name: Assert the core bundle is React-free
        run: |
          if grep -rq "from 'react" dist/core/ dist/chunk-*.js; then
            echo "::error::React reached the headless core bundle - see docs/dependency-budget.md"
            exit 1
          fi

      # esbuild drops directive prologues when it bundles, so this is re-asserted
      # by the build and has to be verified, not assumed.
      - name: Assert the react entry keeps its 'use client' directive
        run: head -n 1 dist/react/index.js | grep -q 'use client'
