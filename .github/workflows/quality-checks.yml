name: Quality Checks

on:
  pull_request:

# No CI run sends usage telemetry. Storybook ignores this variable, so its own
# switch is `core.disableTelemetry` in `.storybook/main.ts`; this covers every
# other tool that honours the convention.
env:
  DO_NOT_TRACK: "1"

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run quality checks (lint + format + typecheck)
        run: make check

      # The story suite runs in a real browser, so `make test` needs one, and
      # the navigation stories run again in the other two engines. Only those
      # three, and only their own dependencies: `--with-deps` is required on
      # the runner because the headless engines link against system libraries
      # the base image does not carry.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run tests
        run: make test

      # Where a link inside a framed HTML result goes is each engine's own
      # decision, so those stories are measured in Firefox and WebKit too.
      - name: Run the navigation stories in Firefox and WebKit
        run: make test-navigation-browsers

      # A story that renders in dev but breaks the static build is a real
      # regression for anyone deploying the Storybook, and nothing else here
      # would catch it - `make test` renders stories through vitest, not through
      # a production build.
      - name: Build Storybook
        run: make build-storybook

      - name: Build both entry points
        run: make build

      # What a consumer's bundler will actually pull from each entry. Lint sees
      # source imports; these walk the built chunk graph, which is where a
      # banned dependency arrives - React into the headless `.` entry, or ajv
      # into `./react`. Also re-checks the 'use client' prologue esbuild drops
      # and `tsup.config.ts` puts back.
      - name: Assert the bundle invariants
        run: make assert-bundle
